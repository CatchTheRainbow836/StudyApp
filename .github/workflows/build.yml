name: Build iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen version

      - name: Generate Xcode Project
        run: |
          rm -rf StudyApp.xcodeproj
          xcodegen generate

      - name: Verify Xcode Project Format
        run: |
          echo "Generated project format:"
          grep -E 'objectVersion|compatibilityVersion' StudyApp.xcodeproj/project.pbxproj | head -5

      - name: Build iOS Application
        run: |
          xcodebuild \
            -project StudyApp.xcodeproj \
            -scheme StudyApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload to IPA
        run: |
          rm -rf Payload StudyApp.ipa
          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/StudyApp.app \
            Payload/

          zip -r StudyApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyApp-IPA
          path: StudyApp.ipa