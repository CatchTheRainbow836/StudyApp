name: Build iOS IPA

on:
push:
branches: [main, master]
workflow_dispatch:

jobs:
build-ipa:
runs-on: macos-14

steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Select Xcode 15.4
    run: |
      sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      xcodebuild -version

  - name: Install XcodeGen
    run: |
      brew install xcodegen
      xcodegen version

  - name: Verify Project Configuration
    run: |
      if [ ! -f project.yml ]; then
        echo "ERROR: project.yml was not found."
        echo "Make sure the XcodeGen specification is named project.yml, not project.yaml."
        exit 1
      fi

      echo "----- project.yml -----"
      cat project.yml
      echo "----------------------"

  - name: Generate Xcode Project
    run: |
      rm -rf StudyTester.xcodeproj
      xcodegen generate

  - name: Verify Generated Project
    run: |
      echo "----- Generated project settings -----"
      grep -E "objectVersion|LastUpgradeCheck" \
        StudyTester.xcodeproj/project.pbxproj || true
      echo "--------------------------------------"

      OBJECT_VERSION=$(grep -E "^objectVersion = " \
        StudyTester.xcodeproj/project.pbxproj \
        | head -1 \
        | sed 's/[^0-9]//g')

      echo "Generated objectVersion: $OBJECT_VERSION"

      if [ -z "$OBJECT_VERSION" ]; then
        echo "ERROR: Could not determine Xcode project format."
        exit 1
      fi

      if [ "$OBJECT_VERSION" -ge 77 ]; then
        echo "ERROR: XcodeGen generated an Xcode 16 project format."
        echo "Xcode 15.4 cannot open this project."
        exit 1
      fi

  - name: Verify StudyTester Scheme
    run: |
      echo "----- Available schemes -----"
      xcodebuild \
        -project StudyTester.xcodeproj \
        -list
      echo "-----------------------------"

      if ! xcodebuild \
        -project StudyTester.xcodeproj \
        -list \
        | grep -q "StudyTester"; then
        echo "ERROR: StudyTester scheme was not generated."
        exit 1
      fi

  - name: Build iOS Application
    run: |
      xcodebuild \
        -project StudyTester.xcodeproj \
        -scheme StudyTester \
        -sdk iphoneos \
        -configuration Release \
        -derivedDataPath build \
        CODE_SIGN_IDENTITY="" \
        CODE_SIGNING_REQUIRED=NO \
        CODE_SIGNING_ALLOWED=NO

  - name: Package Payload to IPA
    run: |
      rm -rf Payload StudyTester.ipa
      mkdir -p Payload

      cp -R \
        build/Build/Products/Release-iphoneos/StudyTester.app \
        Payload/

      cd Payload
      zip -r ../StudyTester.ipa StudyTester.app
      cd ..

  - name: Verify IPA
    run: |
      if [ ! -f StudyTester.ipa ]; then
        echo "ERROR: StudyTester.ipa was not created."
        exit 1
      fi

      echo "IPA successfully created:"
      ls -lh StudyTester.ipa

  - name: Upload IPA Artifact
    uses: actions/upload-artifact@v4
    with:
      name: StudyTester-IPA
      path: StudyTester.ipa

