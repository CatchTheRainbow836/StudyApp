name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen version

      - name: Configure XcodeGen for Xcode 15
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("project.yml")
          text = path.read_text()

          lines = text.splitlines()

          # Remove any existing projectFormat/xcodeVersion entries so that
          # the workflow has complete control over the generated project.
          filtered = []
          for line in lines:
              stripped = line.strip()
              if stripped.startswith("projectFormat:"):
                  continue
              if stripped.startswith("xcodeVersion:"):
                  continue
              filtered.append(line)

          lines = filtered

          # Find an existing top-level "options:" section.
          options_index = None
          for i, line in enumerate(lines):
              if line.strip() == "options:" and not line.startswith(" "):
                  options_index = i
                  break

          if options_index is not None:
              # Insert settings immediately after options:.
              lines.insert(options_index + 1, '  xcodeVersion: "15.4"')
              lines.insert(options_index + 2, '  projectFormat: xcode15_3')
          else:
              # Create an options section at the top level.
              lines.insert(0, "options:")
              lines.insert(1, '  xcodeVersion: "15.4"')
              lines.insert(2, "  projectFormat: xcode15_3")

          path.write_text("\n".join(lines) + "\n")
          PY

          echo "----- project.yml -----"
          cat project.yml
          echo "----------------------"

      - name: Generate Xcode Project
        run: |
          rm -rf StudyTester.xcodeproj
          xcodegen generate

      - name: Verify Generated Project Format
        run: |
          echo "----- Generated project settings -----"
          grep -E "objectVersion|LastUpgradeCheck" StudyTester.xcodeproj/project.pbxproj || true
          echo "--------------------------------------"

          OBJECT_VERSION=$(grep -E "^objectVersion = " StudyTester.xcodeproj/project.pbxproj | head -1 | sed 's/[^0-9]//g')

          echo "Generated objectVersion: $OBJECT_VERSION"

          if [ "$OBJECT_VERSION" -ge 77 ]; then
            echo "ERROR: XcodeGen generated an Xcode 16 project format."
            echo "Xcode 15.4 cannot open this project."
            exit 1
          fi

      - name: Build iOS Application
        run: |
          xcodebuild \
            -project StudyTester.xcodeproj \
            -scheme StudyTester \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload to IPA
        run: |
          rm -rf Payload StudyTester.ipa
          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/StudyTester.app \
            Payload/

          zip -r StudyTester.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyTester-IPA
          path: StudyTester.ipa