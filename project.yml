name: StudyApp

options:
  bundleIdPrefix: com.studyapp
  xcodeVersion: "15.4"
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: "16.0"

targets:
  StudyApp:
    type: application
    platform: iOS

    sources:
      - path: StudyApp
      - path: Questions
        buildPhase: resources

    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.studyapp.app
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

    info:
      path: StudyApp/Info.plist
      properties:
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        CFBundleURLTypes:
          - CFBundleURLName: com.studyapp.app
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - studyapp

        LSApplicationQueriesSchemes:
          - instagram
          - youtube
          - tiktok
          - twitter
          - xhsdiscover
          - x