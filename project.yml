name: StudyTester

options:
  bundleIdPrefix: com.studytester
  xcodeVersion: "15.4"
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: "16.0"

targets:
  StudyTester:
    type: application
    platform: iOS

    sources:
      - path: StudyTester
      - path: Questions
        buildPhase: resources

    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.studytester.app
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

    info:
      path: StudyTester/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.studytester.app
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - studyapp

        LSApplicationQueriesSchemes:
          - instagram
          - youtube
          - tiktok
          - twitter
          - xhsdiscover
          - x